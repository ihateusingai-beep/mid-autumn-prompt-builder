<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中秋節畫畫提詞器｜給同學一齊揀</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .step-panel { display: none; }
    .step-panel.active { display: block; animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .card {
      border: 3px solid #fde68a;
      background: #fffbeb;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card.active {
      border-color: #ea580c;
      background: #ffedd5;
      box-shadow: 0 8px 20px -8px rgba(234,88,12,.45);
    }
    .glass {
      background: rgba(255,251,235,.95);
      backdrop-filter: blur(10px);
    }
    .speak-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.9);
      border: 2px solid #fde68a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      color: #ea580c;
      transition: background .15s, transform .1s;
    }
    .speak-btn:hover { background: #fed7aa; transform: scale(1.1); }
    .speak-btn.speaking { color: #ea580c; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    .big-mode .card { min-height: 148px; }
    .big-mode .card-text { font-size: 1.5rem !important; }
    .big-mode h2 { font-size: 2.2rem !important; }
    .big-mode .speak-btn { width: 44px; height: 44px; font-size: 18px; }
  </style>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen">

  <nav class="sticky top-0 z-40 glass border-b-4 border-orange-200 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <h1 class="text-xl sm:text-2xl font-extrabold text-orange-700">
        <i class="fa-solid fa-moon mr-2"></i>中秋畫畫提詞器
      </h1>
      <div class="flex gap-2">
        <button id="bigModeBtn" onclick="toggleBigMode()" class="bg-white text-stone-500 font-bold px-3 py-2 rounded-2xl border-2 border-stone-200 text-sm">
          <i class="fa-solid fa-text-height"></i> 大字
        </button>
        <button onclick="randomizeAll()" class="bg-yellow-300 text-stone-800 font-extrabold px-3 py-2 rounded-2xl border-2 border-yellow-500 text-sm">
          <i class="fa-solid fa-dice mr-1"></i>隨機
        </button>
        <button onclick="resetAll()" class="bg-white text-stone-500 font-bold px-3 py-2 rounded-2xl border-2 border-stone-200 text-sm">重來</button>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 pt-6 pb-80">
    <div class="flex items-center justify-between mb-6">
      <div class="flex gap-2" id="dots"></div>
      <p class="font-extrabold text-orange-600" id="stepLabel">第 1 步 / 共 5 步</p>
    </div>

    <!-- Step 1 -->
    <section id="step-1" class="step-panel active">
      <h2 class="text-3xl font-extrabold mb-2">👤 邊個係主角？</h2>
      <p class="text-lg text-stone-600 mb-5">撳一下就揀到。</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="who-grid"></div>
    </section>

    <!-- Step 2 -->
    <section id="step-2" class="step-panel">
      <h2 class="text-3xl font-extrabold mb-2">🎯 佢哋做緊咩？</h2>
      <p class="text-lg text-stone-600 mb-5">揀一件最開心嘅事。</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="act-grid"></div>
    </section>

    <!-- Step 3 -->
    <section id="step-3" class="step-panel">
      <h2 class="text-3xl font-extrabold mb-2">🎨 畫面係咩感覺？</h2>
      <p class="text-lg text-stone-600 mb-5">揀一種畫法，愈簡單愈好。</p>
      <div class="grid grid-cols-2 gap-3" id="style-grid"></div>
    </section>

    <!-- Step 4 -->
    <section id="step-4" class="step-panel">
      <h2 class="text-3xl font-extrabold mb-2">🌙 夜空同顏色</h2>
      <p class="text-lg text-stone-600 mb-5">最後揀月亮同燈籠嘅顏色。</p>
      <div class="grid grid-cols-2 gap-3" id="color-grid"></div>
    </section>

    <!-- Step 5: Summary / Confirm -->
    <section id="step-5" class="step-panel">
      <h2 class="text-3xl font-extrabold mb-2">✅ 確認你嘅選擇</h2>
      <p class="text-lg text-stone-600 mb-5">晒下你揀啲乜？搞掂就撳「生成提詞」！</p>
      <div class="space-y-3" id="summary-list"></div>
      <div class="mt-6 p-4 bg-orange-50 rounded-3xl border-4 border-orange-200">
        <p class="text-sm text-stone-500 mb-3 font-bold"><i class="fa-solid fa-magic mr-1"></i>按呢個掣就會生成中秋圖提詞：</p>
        <button onclick="generatePrompt()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-xl py-5 rounded-3xl shadow-xl">
          🌕 生成中秋圖提詞 🌕
        </button>
      </div>
    </section>

    <!-- Navigation -->
    <div class="mt-8 flex justify-between items-center">
      <button id="prevBtn" onclick="go(-1)" class="invisible font-extrabold text-white text-lg px-6 py-4 rounded-3xl bg-stone-400">
        <i class="fa-solid fa-arrow-left mr-2"></i>返去
      </button>
      <div id="nextWrap">
        <button id="nextBtn" onclick="go(1)" class="bg-orange-500 text-white font-extrabold text-lg px-8 py-4 rounded-3xl shadow-lg">
          下一頁 <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Result panel -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[96%] max-w-3xl z-50">
    <div class="glass border-4 border-orange-200 rounded-3xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-2">
        <div class="flex gap-2">
          <button id="tabZh" onclick="setTab('zh')" class="px-3 py-1 rounded-xl font-extrabold bg-orange-500 text-white text-sm">中文提詞</button>
          <button id="tabEn" onclick="setTab('en')" class="px-3 py-1 rounded-xl font-extrabold bg-white text-stone-500 text-sm">英文 Prompt</button>
        </div>
        <span class="text-xs font-bold text-stone-500" id="resultHint">老師可複製去圖像 AI</span>
      </div>
      <p id="outZh" class="bg-white rounded-2xl p-3 min-h-[72px] text-base font-semibold leading-relaxed border-2 border-orange-100">
        請先完成所有選擇。
      </p>
      <p id="outEn" class="hidden bg-white rounded-2xl p-3 min-h-[72px] text-sm font-medium leading-relaxed border-2 border-orange-100"></p>
      <button onclick="copyPrompt()" id="copyBtn" class="mt-3 w-full bg-stone-900 text-white font-extrabold py-3 rounded-2xl">
        <i class="fa-solid fa-copy mr-2"></i>複製提詞
      </button>
    </div>
  </div>

  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-orange-600 text-white font-extrabold px-6 py-3 rounded-full opacity-0 pointer-events-none transition z-50">已複製！</div>

<script>
const data = {
  who: [
    { id:'family', zh:'一家人', en:'a happy family together', img:'img/who-family.jpg' },
    { id:'kids', zh:'小朋友', en:'cheerful children', img:'img/who-kids.jpg' },
    { id:'rabbit', zh:'玉兔', en:'a cute white jade rabbit', img:'img/who-rabbit.jpg' },
    { id:'change', zh:'嫦娥姐姐', en:'a kind fairy lady Chang-e', img:'img/who-change.jpg' },
    { id:'cat', zh:'小貓', en:'a fluffy cat wearing a tiny lantern hat', img:'img/who-cat.jpg' },
    { id:'me', zh:'我自己', en:'a friendly student character', img:'img/who-me.jpg' }
  ],
  act: [
    { id:'moon', zh:'賞月', en:'looking at a huge round full moon', img:'img/act-moon.jpg' },
    { id:'lantern', zh:'提燈籠', en:'holding glowing red paper lanterns', img:'img/act-lantern.jpg' },
    { id:'cake', zh:'食月餅', en:'sharing mooncakes on a picnic table', img:'img/act-cake.jpg' },
    { id:'sky', zh:'放天燈', en:'releasing warm sky lanterns into the night', img:'img/act-sky.jpg' },
    { id:'garden', zh:'花園賞桂', en:'standing in an osmanthus garden under moonlight', img:'img/act-garden.jpg' },
    { id:'boat', zh:'湖邊睇月', en:'sitting by a calm lake reflecting the moon', img:'img/act-boat.jpg' }
  ],
  style: [
    { id:'cartoon', zh:'可愛卡通', en:'simple cute cartoon illustration, big faces, thick outlines, easy to understand', img:'img/style-cartoon.jpg' },
    { id:'picturebook', zh:'圖畫書', en:'children picture-book watercolor, soft and warm', img:'img/style-picturebook.jpg' },
    { id:'paper', zh:'剪紙燈籠', en:'Chinese paper-cut and lantern festival craft look, flat shapes', img:'img/style-paper.jpg' },
    { id:'night', zh:'溫柔夜空', en:'gentle night scene, glowing lights, not scary', img:'img/style-night.jpg' }
  ],
  color: [
    { id:'gold', zh:'金黃月亮', en:'golden full moon, warm amber light', css:'linear-gradient(135deg,#f59e0b,#fde68a)', img:'img/color-gold.jpg' },
    { id:'red', zh:'紅燈籠', en:'bright festive red lanterns and gold trim', css:'linear-gradient(135deg,#dc2626,#fbbf24)', img:'img/color-red.jpg' },
    { id:'purple', zh:'粉紫夜空', en:'soft purple-blue night sky with stars', css:'linear-gradient(135deg,#7c3aed,#93c5fd)', img:'img/color-purple.jpg' },
    { id:'osmanthus', zh:'桂花黃', en:'osmanthus yellow and creamy white', css:'linear-gradient(135deg,#eab308,#fff7ed)', img:'img/color-osmanthus.jpg' }
  ]
};

const NEG_ZH = '唔好恐怖、唔好黑暗、唔好複雜字、唔好模糊、唔好有浮水印';
const NEG_EN = 'no horror, no dark scary mood, no messy text, no blurry faces, no watermark, no crowded tiny details';

let step = 1;
const total = 5;
let tab = 'zh';
let sel = { who:null, act:null, style:null, color:null };
let generated = false;
let bigMode = false;
let speakingId = null;

// ── Voice ────────────────────────────────────────────────────────────────
const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
function getVoice() {
  const list = window.speechSynthesis?.getVoices() || [];
  return list.find(v => v.lang.startsWith('zh')) || list[0] || null;
}
function speak(text, btnEl) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK';
  u.rate = 0.85;
  const v = getVoice();
  if (v) u.voice = v;
  u.onend = u.onerror = () => {
    if (speakingId === btnEl) {
      speakingId = null;
      btnEl?.classList.remove('speaking');
    }
  };
  speakingId = btnEl;
  if (btnEl) btnEl.classList.add('speaking');
  window.speechSynthesis.speak(u);
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => voices.push(...window.speechSynthesis.getVoices());
  window.speechSynthesis.getVoices();
}

// ── Sound ─────────────────────────────────────────────────────────────────
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      o.type = 'sine';
      g.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.5);
      o.start(ctx.currentTime + i * 0.15);
      o.stop(ctx.currentTime + i * 0.15 + 0.5);
    });
  } catch(e) {}
}

// ── Render: who / act ─────────────────────────────────────────────────────
function renderWhoAct(id, list, key) {
  const box = document.getElementById(id);
  box.innerHTML = list.map(item => `
    <div class="card rounded-3xl p-3 text-center relative ${sel[key]?.id===item.id?'active':''}" style="min-height:170px">
      <button class="speak-btn" onclick="event.stopPropagation();speak('${item.zh}', this)" title="朗讀">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="w-full h-full flex flex-col items-center justify-center gap-1" onclick="pick('${key}','${item.id}')">
        <img src="${item.img}" alt="${item.zh}" style="width:90px;height:90px;object-fit:cover;border-radius:16px;border:3px solid #fde68a;" loading="lazy">
        <span class="card-text text-lg font-extrabold mt-1 leading-tight">${item.zh}</span>
      </button>
    </div>
  `).join('');
}

// ── Render: style ─────────────────────────────────────────────────────────
function renderStyle() {
  const box = document.getElementById('style-grid');
  box.innerHTML = data.style.map(item => `
    <div class="card rounded-3xl p-3 text-center relative ${sel.style?.id===item.id?'active':''}" style="min-height:170px">
      <button class="speak-btn" onclick="event.stopPropagation();speak('${item.zh}', this)" title="朗讀">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="w-full h-full flex flex-col items-center justify-center gap-2" onclick="pick('style','${item.id}')">
        <img src="${item.img}" alt="${item.zh}" style="width:110px;height:80px;object-fit:cover;border-radius:14px;border:3px solid #fde68a;" loading="lazy">
        <span class="card-text text-lg font-extrabold">${item.zh}</span>
      </button>
    </div>
  `).join('');
}

// ── Render: color ─────────────────────────────────────────────────────────
function renderColor() {
  const box = document.getElementById('color-grid');
  box.innerHTML = data.color.map(item => `
    <div class="card rounded-3xl p-3 text-center relative ${sel.color?.id===item.id?'active':''}" style="min-height:170px">
      <button class="speak-btn" onclick="event.stopPropagation();speak('${item.zh}', this)" title="朗讀">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="w-full h-full flex flex-col items-center justify-center gap-2" onclick="pick('color','${item.id}')">
        <img src="${item.img}" alt="${item.zh}" style="width:140px;height:70px;object-fit:cover;border-radius:14px;border:3px solid #fde68a;" loading="lazy">
        <span class="card-text text-lg font-extrabold">${item.zh}</span>
      </button>
    </div>
  `).join('');
}

// ── Summary ───────────────────────────────────────────────────────────────
function renderSummary() {
  const stepNames = { who:'👤 主角', act:'🎯 活動', style:'🎨 畫風', color:'🌙 顏色' };
  const summaryList = document.getElementById('summary-list');
  summaryList.innerHTML = ['who','act','style','color'].map(key => {
    const s = sel[key];
    const done = s !== null;
    const imgTag = done && s.img ? `<img src="${s.img}" style="width:60px;height:60px;object-fit:cover;border-radius:12px;border:2px solid #fde68a;flex-shrink:0">` : `<div style="width:60px;height:60px;background:#fde68a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0">❓</div>`;
    return `
      <div class="flex items-center gap-4 bg-white rounded-2xl p-3 border-2 ${done?'border-orange-200':'border-stone-300'}">
        ${imgTag}
        <div class="flex-1">
          <div class="text-sm font-bold text-stone-400 uppercase tracking-wide">${stepNames[key]}</div>
          <div class="text-lg font-extrabold ${done?'text-stone-800':'text-stone-400'}">${done ? s.zh : '未揀'}</div>
        </div>
        <button onclick="goToStep('${key}')" class="flex-shrink-0 bg-orange-100 text-orange-700 font-extrabold px-4 py-2 rounded-2xl border-2 border-orange-300 text-sm">
          ${done?'✏️ 改':'➕ 揀'}
        </button>
      </div>
    `;
  }).join('');
}

// ── Main render ───────────────────────────────────────────────────────────
function renderAll() {
  renderWhoAct('who-grid', data.who, 'who');
  renderWhoAct('act-grid', data.act, 'act');
  renderStyle();
  renderColor();
  renderSummary();

  document.getElementById('dots').innerHTML = Array.from({length:total}, (_,i)=>`
    <span class="w-4 h-4 rounded-full transition ${i+1===step?'bg-orange-500':'bg-orange-200'} ${i+1>step?'opacity:40':''}"></span>
  `).join('');
  document.getElementById('stepLabel').textContent = `第 ${step} 步 / 共 ${total} 步`;
  document.querySelectorAll('.step-panel').forEach((el,i)=> el.classList.toggle('active', i+1===step));
  document.getElementById('prevBtn').classList.toggle('invisible', step===1);

  // nextBtn logic
  const nextWrap = document.getElementById('nextWrap');
  if (step === 4) {
    // After step 4 → go to summary (step 5)
    nextWrap.innerHTML = `<button onclick="go(1)" class="bg-orange-500 text-white font-extrabold text-lg px-8 py-4 rounded-3xl shadow-lg">
      ✅ 確認選擇 <i class="fa-solid fa-arrow-right ml-2"></i>
    </button>`;
  } else if (step === 5) {
    nextWrap.innerHTML = '';
  } else {
    nextWrap.innerHTML = `<button onclick="go(1)" class="bg-orange-500 text-white font-extrabold text-lg px-8 py-4 rounded-3xl shadow-lg">
      下一頁 <i class="fa-solid fa-arrow-right ml-2"></i>
    </button>`;
  }
}

function pick(key, id) {
  sel[key] = (key==='color'?data.color:data[key]==='who'?data.who:data[key]==='act'?data.act:data.style).find(x=>x.id===id);
  playChime();
  renderAll();
}

function go(d) {
  const next = step + d;
  if (next < 1 || next > total) return;
  step = next;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToStep(key) {
  const map = { who:1, act:2, style:3, color:4 };
  step = map[key] || 1;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setTab(t) {
  tab = t;
  document.getElementById('outZh').classList.toggle('hidden', t!=='zh');
  document.getElementById('outEn').classList.toggle('hidden', t!=='en');
  document.getElementById('tabZh').className = t==='zh'
    ? 'px-3 py-1 rounded-xl font-extrabold bg-orange-500 text-white text-sm'
    : 'px-3 py-1 rounded-xl font-extrabold bg-white text-stone-500 text-sm';
  document.getElementById('tabEn').className = t==='en'
    ? 'px-3 py-1 rounded-xl font-extrabold bg-orange-500 text-white text-sm'
    : 'px-3 py-1 rounded-xl font-extrabold bg-white text-stone-500 text-sm';
}

function updatePrompt() {
  const who = sel.who, act = sel.act, st = sel.style, col = sel.color;
  if (!who) {
    document.getElementById('outZh').textContent = '請先完成所有選擇。';
    document.getElementById('outEn').textContent = 'Please complete all steps first.';
    return;
  }
  const zh = [
    '一張開心、容易睇嘅中秋節圖。',
    `主角係${who.zh}。`,
    act ? `佢哋喺度${act.zh}。` : '',
    st ? `畫風係${st.zh}。` : '',
    col ? `顏色係${col.zh}。` : '',
    '畫面要大、清楚、溫暖、適合小朋友。',
    '負面：' + NEG_ZH
  ].filter(Boolean).join('');

  const en = [
    'A joyful Mid-Autumn Festival scene that is easy to understand.',
    `Main subject: ${who.en}.`,
    act ? `They are ${act.en}.` : '',
    st ? `Art style: ${st.en}.` : '',
    col ? `Colors: ${col.en}.` : '',
    'Big clear shapes, warm and safe for children, simple composition, centered subject.',
    'Negative prompt: ' + NEG_EN
  ].filter(Boolean).join(' ');

  document.getElementById('outZh').textContent = zh;
  document.getElementById('outEn').textContent = en;
}

function generatePrompt() {
  generated = true;
  updatePrompt();
  playChime();
  // Show toast
  const t = document.getElementById('toast');
  t.textContent = '🌕 提詞已生成！';
  t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2000);
}

function copyPrompt() {
  const text = tab === 'zh'
    ? document.getElementById('outZh').textContent
    : document.getElementById('outEn').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const t = document.getElementById('toast');
    t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 1400);
  });
}

function randomizeAll() {
  const pickRand = arr => arr[Math.floor(Math.random()*arr.length)];
  sel.who = pickRand(data.who);
  sel.act = pickRand(data.act);
  sel.style = pickRand(data.style);
  sel.color = pickRand(data.color);
  generated = false;
  step = 5;
  renderAll();
  renderSummary();
  playChime();
}

function resetAll() {
  sel = { who:null, act:null, style:null, color:null };
  step = 1;
  generated = false;
  window.speechSynthesis?.cancel();
  renderAll();
  renderSummary();
}

function toggleBigMode() {
  bigMode = !bigMode;
  document.body.classList.toggle('big-mode', bigMode);
  document.getElementById('bigModeBtn').classList.toggle('bg-orange-100', bigMode);
  document.getElementById('bigModeBtn').classList.toggle('border-orange-400', bigMode);
  document.getElementById('bigModeBtn').classList.toggle('text-orange-700', bigMode);
}

// Hook pick into auto-advance
const _pick = pick;
// Auto-advance after 600ms
function pick(key, id) {
  _pick(key, id);
  generated = false;
  if (step < 4) {
    clearTimeout(window._advTimer);
    window._advTimer = setTimeout(() => {
      step = step + 1;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 600);
  }
}
